name: Validate Files
on: 
    # push:
    workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate index.html
        run: |
          if [ ! -f index.html ]; then
            echo "index.html file is missing!"
            exit 1
          fi
          echo "index.html file is present."

      - name: Validate script.js
        run: |
          if [ ! -f script.js ]; then
            echo "script.js file is missing!"
            exit 1
          fi
          echo "script.js file is present."

      